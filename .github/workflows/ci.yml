name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if secret-like files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.p12$|\.keystore$'; then
            echo "ERROR: secret-like file found in the repository"
            exit 1
          fi
          echo "OK: no secret-like files committed"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Security audit (production packages, must pass)
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (dev tools, warning only)
        run: npm audit --audit-level=high
        continue-on-error: true
