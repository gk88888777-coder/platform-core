name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if secret-like files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.p12$|\.keystore$|(^|/)client_secret[^/]*\.json$|(^|/)google-services\.json$|(^|/)GoogleService-Info\.plist$'; then
            echo "ERROR: secret-like file found in the repository"
            exit 1
          fi
          echo "OK: no secret-like files committed"

  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: ci_db
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: "ci-only-jwt-secret-used-nowhere-else-0123456789"
      OTP_PEPPER: "ci-only-otp-pepper-used-nowhere-else-0123456789"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Security audit (production packages, must pass)
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (dev tools, warning only)
        run: npm audit --audit-level=high
        continue-on-error: true
